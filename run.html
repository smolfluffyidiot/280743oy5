<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace Dashboard</title>
</head>
<body>
    <div id="app-root"></div>
    <script>
        fetch('config.data')
            .then(response => {
                if (!response.ok) throw new Error('Network response was not ok');
                return response.text();
            })
            .then(rawData => {
                const parser = new DOMParser();
                const doc = parser.parseFromString(rawData, 'text/html');
                Array.from(doc.head.childNodes).forEach(node => {
                    document.head.appendChild(node.cloneNode(true));
                });
                document.getElementById('app-root').innerHTML = doc.body.innerHTML;
                const scripts = doc.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    if (oldScript.src) {
                        newScript.src = oldScript.src;
                    } else {
                        newScript.textContent = oldScript.textContent;
                    }
                    document.body.appendChild(newScript);
                });
            })
            .catch(error => {
                console.error('Error rendering application workspace:', error);
            });
    </script>
</body>
</html>
